name: Docs - Doxygen and Pages

on:
  pull_request:
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'Doxyfile'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'docs/**'
      - 'doxygen/**'
      - 'BSP/**'
      - 'UserSrc/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'Doxyfile'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'docs/**'
      - 'doxygen/**'
      - 'BSP/**'
      - 'UserSrc/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs and Doxygen site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Build MkDocs portal
        run: mkdocs build --strict

      - name: Build Doxygen reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/doxygen
          doxygen Doxyfile
          test -f build/doxygen/html/index.html
          mkdir -p site/api
          cp -a build/doxygen/html/. site/api/
          touch site/.nojekyll
          test -f site/api/index.html

      - name: Upload Doxygen warnings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: art-pi-doxygen-warnings
          path: build/doxygen/warnings.log
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload combined Pages site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
